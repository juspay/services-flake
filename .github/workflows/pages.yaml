# Publish the docs site (./doc) to GitHub Pages, which serves it at the
# https://services.nixos.asia custom domain (set in the repo's Pages settings).
#
# Same shape as https://github.com/srid/emanote-template's publish workflow.
name: pages

on:
  push:
    # Any branch, so that docs changes on a PR branch are published for review
    # (Pages serves a single site, so the latest push wins). The `github-pages`
    # environment's deployment branch policies gate who can deploy.
    paths:
      - "doc/**"
      - ".github/workflows/pages.yaml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - name: Build the static site
        # --accept-flake-config picks up the `cache.nixos.asia` substituter
        # declared in ./doc/flake.nix, which caches Emanote builds.
        run: nix --accept-flake-config build ./doc -o ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
